services:
  - type: web
    name: parasite-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_render_db.py && gunicorn dashboard:server --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
